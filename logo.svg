<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c10"/>
      <stop offset="100%" style="stop-color:#060608"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="40" ry="40" fill="url(#bg-grad)"/>
  <!-- Border glow -->
  <rect width="198" height="198" x="1" y="1" rx="39" ry="39" fill="none" stroke="#25252f" stroke-width="1.5"/>
  <!-- Letter R -->
  <text x="50%" y="54%" dominant-baseline="central" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="130" fill="url(#accent)">R</text>
  <!-- Accent dot -->
  <circle cx="148" cy="148" r="10" fill="#4ade80"/>
</svg>
